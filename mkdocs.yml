site_name: FlowRoute
site_description: Developer guide for safe, selective routing to deterministic workflows.
site_url: https://open-first.github.io/FlowRoute/
repo_url: https://github.com/open-first/FlowRoute
repo_name: open-first/FlowRoute
edit_uri: edit/main/docs/
site_dir: site
docs_dir: docs
strict: true

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Deploy these docs: getting-started/deploy-docs.md
  - Developer guides:
      - Workflow contracts: guides/workflow-contracts.md
      - Python integration: guides/python-integration.md
      - HTTP API: guides/http-api.md
      - Command-line interface: guides/cli.md
  - Concepts:
      - Routing pipeline: concepts/routing-pipeline.md
      - Decisions and reasons: concepts/decisions.md
      - Safety boundary: concepts/safety-boundary.md
      - Architecture notes: architecture.md
  - Operations:
      - Production mode: operations/production-mode.md
      - Artifact manifests: operations/artifact-manifests.md
      - Container deployment: operations/container-deployment.md
      - Production checklist: operations/production.md
      - Troubleshooting: operations/troubleshooting.md
  - Reference:
      - Configuration: reference/configuration.md
      - Python models: reference/python-models.md
      - Repository map: reference/repository-map.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra_css:
  - stylesheets/extra.css

copyright: FlowRoute contributors · Apache-2.0

extra:
  generator: false

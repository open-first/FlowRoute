[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowroute"
version = "0.2.0"
description = "Selective routing to deterministic workflows without generative LLM inference"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Ali Norouzi", email = "anorouzi.work@gmail.com"}]
maintainers = [{name = "Ali Norouzi", email = "anorouzi.work@gmail.com"}]
keywords = ["agents", "routing", "workflows", "semantic-router", "huggingface"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<2.5",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "regex>=2024.11,<2027",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
hf = [
  "sentence-transformers>=3.4,<6",
  "torch>=2.3,<3",
  "transformers>=4.48,<6",
]
training = [
  "accelerate>=1,<3",
  "datasets>=5.0.1,<6",
  "sentence-transformers>=3.4,<6",
  "torch>=2.3,<3",
  "transformers>=4.48,<6",
]
dev = [
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pip-audit>=2.10,<3",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
flowroute = "flowroute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_configs = true
disable_error_code = ["import-untyped"]
